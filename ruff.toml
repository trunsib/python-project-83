exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

target-version = "py310"

select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
]

ignore = [
    "E501",
    "B008",
    "C901",
]

line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["page_analyzer"]
combine-as-imports = true
