# Конфигурация ruff линтера

# Пути для игнорирования
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

# Целевая версия Python
target-version = "py310"

# Правила линтинга
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

# Игнорируемые правила
ignore = [
    "E501",   # line too long (исправлено автоматически)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex (пока оставим)
]

# Максимальная сложность функций
max-complexity = 10

# Настройки форматирования
line-length = 100

# Настройки для импортов
[tool.ruff.isort]
known-first-party = ["page_analyzer"]
combine-as-imports = true