[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer project"
authors = [
  { name = "trun", email = "e.s.trunov@gmail.com" }
]
readme = "README.md"

dependencies = [
  "flask",
  "psycopg2-binary",
  "validators",
  "requests",
  "beautifulsoup4",
  "python-dotenv",
  "gunicorn",
]

[tool.poetry]
packages = [
  { include = "page_analyzer" }
]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-flask = "^1.3.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
